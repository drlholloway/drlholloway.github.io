name: Hyas CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.x, 24.x]

    steps:
    - name: Check out Hyas project
      uses: actions/checkout@v7

    - name: Set up Node.js ${{ matrix.node }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node }}
        cache: npm

    - name: Install Dart Sass
      env:
        DART_SASS_VERSION: 1.105.1
      run: |
        case "$RUNNER_OS" in Linux) os=linux ;; macOS) os=macos ;; esac
        case "$RUNNER_ARCH" in X64) arch=x64 ;; ARM64) arch=arm64 ;; esac
        curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-${os}-${arch}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

    - name: Install dependencies
      run: npm ci

    - name: Run Hyas test script
      run: npm test

    - name: Build production website
      run: npm run build
